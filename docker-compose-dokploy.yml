services:
  db:
    image: postgis/postgis:15-3.3
    container_name: litefarm-db
    restart: always
    environment:
      POSTGRES_USER: litefarm_user
      POSTGRES_PASSWORD: litefarm_password
      POSTGRES_DB: litefarm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litefarm_user -d litefarm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: litefarm-redis
    restart: always

  api:
    build:
      context: .                          # Repo kök dizini
      dockerfile: packages/api/Dockerfile  # Dockerfile dosyasının konumu
    container_name: litefarm-api
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: litefarm_user
      DB_PASSWORD: litefarm_password
      DB_NAME: litefarm_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "guvenli_random_jwt_anahtari"

  webapp:
    build:
      context: .                             # Repo kök dizini
      dockerfile: packages/webapp/Dockerfile # Dockerfile dosyasının konumu
    container_name: litefarm-webapp
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data: